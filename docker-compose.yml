version: '3.8'

services:
  web:
    image: yasminletiere-confeitaria-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=YasminLetiereConfeitaria_Docker;Username=postgres;Password=123456;Port=5432;
      - JwtSettings__SecretKey=YasminLetiereConfeitariaDockerSecretKey2026!!!
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=YasminLetiereConfeitaria_Docker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
